[package]
name = "career_compiler"
version = "0.1.0"
description = "Private evidence-grounded resume compiler for Mir Athfan Ali"
authors = ["Mir Athfan Ali"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "career_compiler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-opener = "2.5.4"
thiserror = "2.0.18"
keyring = { version = "3.6.3", features = ["apple-native"] }
reqwest = { version = "0.13.3", features = ["json", "rustls"] }
base64 = "0.22.1"
rand = "0.9.2"
sha2 = "0.10.8"
