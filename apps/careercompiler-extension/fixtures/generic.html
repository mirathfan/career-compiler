<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Generic CareerCompiler Fixture</title></head>
  <body>
    <h1>Software Engineer Application</h1>
    <form>
      <label>First name <input name="first_name" /></label>
      <label>Last name <input name="last_name" /></label>
      <label>Email <input type="email" name="email" /></label>
      <label>Phone <input type="tel" name="phone" /></label>
      <label>LinkedIn <input name="linkedin" /></label>
      <label>Are you authorized to work in the United States? <select name="work_auth"><option></option><option>Yes</option><option>No</option></select></label>
      <label>Will you now or in the future require sponsorship? <select name="sponsorship"><option></option><option>Yes</option><option>No</option></select></label>
      <label>Why are you a strong fit for this role? <textarea name="fit"></textarea></label>
      <input type="text" name="do_not_fill_honeypot" style="display:none" />
      <button type="submit">Submit Application</button>
    </form>
  </body>
</html>
