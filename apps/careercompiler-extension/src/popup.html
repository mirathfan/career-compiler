<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CareerCompiler</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <p>CareerCompiler</p>
        <h1>Application Autofill</h1>
      </header>

      <section id="status" class="status">Checking CareerCompiler connection...</section>

      <section id="pairing" class="pairing">
        <label>
          Pairing code
          <input id="pairing-code" inputmode="numeric" maxlength="6" placeholder="123456" />
        </label>
        <button id="pair" type="button">Pair extension</button>
      </section>

      <dl>
        <div><dt>ATS</dt><dd id="ats">-</dd></div>
        <div><dt>Fields</dt><dd id="fields">0</dd></div>
        <div><dt>Ready</dt><dd id="safe">0</dd></div>
        <div><dt>Review</dt><dd id="review">0</dd></div>
      </dl>

      <section class="context">
        <p id="company">-</p>
        <p id="role">-</p>
      </section>

      <div class="actions">
        <button id="scan" type="button">Re-scan</button>
        <button id="fill" type="button" disabled>Fill with CareerCompiler</button>
        <button id="save-edits" type="button" disabled>Save edits to CareerCompiler</button>
        <button id="clear" type="button">Clear highlights</button>
      </div>

      <footer>CareerCompiler filled this application. Review all highlighted answers and submit manually.</footer>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
